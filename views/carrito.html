<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - HeavyLux</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="top-bar"><p>ENVIOS A TODO EL META · WHATSAPP +57 313 734 9236 · LUN-SÁB 8AM-6PM</p></div>
    <nav class="navbar">
        <div class="logo">
            <div class="logo-bars"><div class="logo-bar"></div><div class="logo-bar"></div></div>
            <div class="logo-text"><span class="logo-heavy">HEAVY</span><span class="logo-lux">LUX</span></div>
        </div>
        <ul class="nav-links">
            <li><a href="/">INICIO</a></li>
            <li><a href="/catalogo">CATÁLOGO</a></li>
            <li><a href="/cotizar">COTIZAR</a></li>
            <li><a href="/nosotros">NOSOTROS</a></li>
            <li><a href="/contacto">CONTACTO</a></li>
        </ul>
        <div class="navbar-actions">
            <a href="/cuenta" class="navbar-icon">👤 CUENTA</a>
            <a href="/carrito" class="navbar-icon btn-carrito">🛒 CARRITO</a>
        </div>
    </nav>

    <section class="carro">
        <div class="carro-contenido">
            <p class="carro-ruta"><a href="/">Inicio</a> / <span>Carrito</span></p>
            <h1>Carrito <small id="carro-contador">(0 productos)</small></h1>
            <div id="carrito-contenido"></div>
        </div>
    </section>

    <footer class="footer">
        <p><span class="logo-heavy">HEAVY</span><span class="logo-lux">LUX</span></p>
        <p>Acacías, Meta · heavylux@gmail.com</p>
        <p>© 2026 HeavyLux · Todos los derechos reservados</p>
    </footer>

    <script>
        function esc(t) {
            return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function leerCarrito() {
            return JSON.parse(localStorage.getItem('carrito') || '[]');
        }
        function guardar(items) {
            localStorage.setItem('carrito', JSON.stringify(items));
            mostrar();
        }
        function quitar(id) {
            guardar(leerCarrito().filter(p => p.id !== id));
        }
        function cambiarCantidad(id, delta) {
            const items = leerCarrito();
            const p = items.find(x => x.id === id);
            if (!p) return;
            p.cantidad = Math.max(1, (p.cantidad || 1) + delta);
            guardar(items);
        }
        function irACotizar() {
            const lista = leerCarrito().map(p => p.nombre + ' x' + (p.cantidad || 1)).join(', ');
            window.location.href = '/cotizar?productos=' + encodeURIComponent(lista);
        }
        function mostrar() {
            const items = leerCarrito();
            const cont = document.getElementById('carrito-contenido');
            const n = items.reduce((s, p) => s + (p.cantidad || 1), 0);
            document.getElementById('carro-contador').textContent = '(' + n + (n === 1 ? ' producto)' : ' productos)');
            if (items.length === 0) {
                cont.innerHTML = '<div class="carro-vacio">' +
                    '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12l2 5v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7z"/><path d="M4 7h16"/><path d="M9 12a3 3 0 0 0 6 0"/></svg>' +
                    '<h2>Tu carrito está vacío</h2><p>Agrega productos desde el catálogo.</p>' +
                    '<a href="/catalogo" class="carro-btn">VER CATÁLOGO</a></div>';
                return;
            }
            const total = items.reduce((s, p) => s + Number(p.precio) * (p.cantidad || 1), 0);
            cont.innerHTML = items.map(p => `
                <div class="carrito-item">
                    <span>${esc(p.nombre)}</span>
                    <span>
                        <button onclick="cambiarCantidad(${p.id}, -1)">−</button>
                        ${p.cantidad || 1}
                        <button onclick="cambiarCantidad(${p.id}, 1)">+</button>
                    </span>
                    <span>$${(Number(p.precio) * (p.cantidad || 1)).toLocaleString('es-CO')}</span>
                    <button onclick="quitar(${p.id})">Quitar</button>
                </div>
            `).join('') + `
                <p class="carrito-total">Total: $${total.toLocaleString('es-CO')}</p>
                <a href="/checkout" class="btn-primary">Finalizar compra</a>
                <a href="#" class="btn-secondary" onclick="irACotizar(); return false;">Solicitar cotización</a>
            `;
        }
        mostrar();
    </script>
    <script src="/js/carrito-contador.js"></script>
</body>
</html>
