<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - HeavyLux</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="top-bar">
        <p>ENVIOS A TODO EL META · WHATSAPP +57 313 734 9236 · LUN-SÁB 8AM-6PM</p>
    </div>
    <nav class="navbar">
        <div class="logo">
            <div class="logo-bars">
                <div class="logo-bar"></div>
                <div class="logo-bar"></div>
            </div>
            <div class="logo-text">
                <span class="logo-heavy">HEAVY</span>
                <span class="logo-lux">LUX</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="/">INICIO</a></li>
            <li><a href="/catalogo">CATÁLOGO</a></li>
            <li><a href="/cotizar">COTIZAR</a></li>
            <li><a href="/nosotros">NOSOTROS</a></li>
            <li><a href="/contacto">CONTACTO</a></li>
        </ul>
        <div class="navbar-actions">
            <a href="/cuenta" class="navbar-icon">👤 CUENTA</a>
            <a href="/carrito" class="navbar-icon btn-carrito">🛒 CARRITO</a>
        </div>
    </nav>
    <section class="carrito">
        <h1>Tu carrito</h1>
        <div id="carrito-contenido"></div>
    </section>
    <footer class="footer">
        <p><span class="logo-heavy">HEAVY</span><span class="logo-lux">LUX</span></p>
        <p>© 2026 HeavyLux · Todos los derechos reservados</p>
    </footer>
    <a href="https://wa.me/573137349236?text=Hola%20HeavyLux%2C%20quiero%20informaci%C3%B3n" class="whatsapp-flotante" target="_blank" title="Escríbenos por WhatsApp">
        <svg viewBox="0 0 32 32" width="32" height="32" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.003 3C8.83 3 3 8.83 3 16c0 2.29.6 4.52 1.74 6.49L3 29l6.68-1.72A12.94 12.94 0 0 0 16.003 29C23.17 29 29 23.17 29 16S23.17 3 16.003 3zm0 23.7c-1.95 0-3.86-.53-5.53-1.52l-.4-.24-3.96 1.02 1.06-3.86-.26-.4A10.64 10.64 0 0 1 5.3 16c0-5.9 4.8-10.7 10.7-10.7S26.7 10.1 26.7 16s-4.8 10.7-10.7 10.7z"/>
        </svg>
    </a>
    <script>
        function leerCarrito() {
            return JSON.parse(localStorage.getItem('carrito') || '[]');
        }
        function quitar(id) {
            const nuevo = leerCarrito().filter(p => p.id !== id);
            localStorage.setItem('carrito', JSON.stringify(nuevo));
            mostrar();
        }
        function irACotizar() {
            const lista = leerCarrito().map(p => p.nombre).join(', ');
            window.location.href = '/cotizar?productos=' + encodeURIComponent(lista);
        }
        function mostrar() {
            const items = leerCarrito();
            const cont = document.getElementById('carrito-contenido');
            if (items.length === 0) {
                cont.innerHTML = '<p style="color:#aaaaaa">Tu carrito está vacío. <a href="/catalogo" style="color:#CC0000">Ver catálogo</a></p>';
                return;
            }
            const total = items.reduce((s, p) => s + Number(p.precio), 0);
            cont.innerHTML = items.map(p => `
                <div class="carrito-item">
                    <span>${p.nombre}</span>
                    <span>$${Number(p.precio).toLocaleString('es-CO')}</span>
                    <button onclick="quitar(${p.id})">Quitar</button>
                </div>
            `).join('') + `
                <p class="carrito-total">Total: $${total.toLocaleString('es-CO')}</p>
                <a href="/checkout" class="btn-primary">Finalizar compra</a>
                <a href="#" class="btn-secondary" onclick="irACotizar(); return false;">Solicitar cotización</a>
                `;
        }
        mostrar();
    </script>
<a href="https://wa.me/573137349236?text=Hola%20HeavyLux%2C%20quiero%20informaci%C3%B3n" class="whatsapp-flotante" target="_blank" title="Escr%C3%ADbenos por WhatsApp">💬</a>
</html>
