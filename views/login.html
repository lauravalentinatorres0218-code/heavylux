<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HeavyLux Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <span class="logo-heavy">HEAVY</span>
                <span class="logo-lux">LUX</span>
            </div>
            <h2>Panel Administrativo</h2>
            <p class="login-sub">Ingresa tus credenciales para continuar</p>
            <form class="login-form" action="/login" method="POST">
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" name="correo" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <div id="error-login" style="color:#CC0000; font-size:13px; margin-bottom:10px;"></div>
                <button type="submit" class="btn-submit">Ingresa</button>
            </form>
        </div>
    </div>
</body>
</html>
