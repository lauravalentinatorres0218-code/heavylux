<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - HeavyLux</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo" style="justify-content:center; margin-bottom:15px;">
                <div class="logo-bars">
                    <div class="logo-bar"></div>
                    <div class="logo-bar"></div>
                </div>
                <div class="logo-text">
                    <span class="logo-heavy">HEAVY</span>
                    <span class="logo-lux">LUX</span>
                </div>
            </div>
            <h2>Crear cuenta</h2>
            <p class="login-sub">Regístrate para comprar y seguir tus pedidos</p>
            <form class="login-form" action="/registro" method="POST">
                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" name="nombre" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" name="telefono">
                </div>
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" name="correo" required>
                </div>
                <div class="form-group">
                    <label>Contraseña (mínimo 6 caracteres)</label>
                    <input type="password" name="password" minlength="6" required>
                </div>
                <div id="error-registro" style="color:#CC0000; font-size:13px; margin-bottom:10px;"></div>
                <button type="submit" class="btn-submit">Crear cuenta</button>
            </form>
            <p style="margin-top:20px; font-size:13px; color:#aaaaaa;">¿Ya tienes cuenta? <a href="/login" style="color:#CC0000;">Inicia sesión</a></p>
        </div>
    </div>
    <script>
        const e = new URLSearchParams(window.location.search).get('error');
        if (e) {
            document.getElementById('error-registro').textContent =
                e === 'existe' ? 'Ese correo ya está registrado.' :
                e === 'datos' ? 'Revisa los datos (contraseña de mínimo 6 caracteres).' :
                'No se pudo crear la cuenta. Intenta de nuevo.';
        }
    </script>
</body>
</html>
