<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de pago - HeavyLux Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="top-bar"><p>PANEL ADMINISTRATIVO · HEAVYLUX</p></div>
<nav class="navbar">
    <div class="logo">
        <div class="logo-bars"><div class="logo-bar"></div><div class="logo-bar"></div></div>
        <div class="logo-text">
            <span class="logo-heavy">HEAVY</span>
            <span class="logo-lux">LUX</span>
        </div>
    </div>
    <ul class="nav-links">
        <li><a href="/admin">INICIO</a></li>
        <li><a href="/admin/cotizaciones-lista">COTIZACIONES</a></li>
        <li><a href="/admin/pedidos">PEDIDOS</a></li>
        <li><a href="/admin/productos">PRODUCTOS</a></li>
        <li><a href="/admin/pago">PAGOS</a></li>
    </ul>
    <div class="navbar-actions">
        <a href="/cuenta" class="navbar-icon btn-carrito">👤 CUENTA</a>
    </div>
</nav>
<section class="admin-dashboard">
    <h1>DATOS DE PAGO</h1>
    <div class="admin-seccion">
        <form class="cotizar-form" id="form-pago">
            <div class="form-group">
                <label>Transferencia bancaria (banco, tipo de cuenta, número, titular)</label>
                <textarea id="p-transferencia" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>Nequi / Daviplata (número y titular)</label>
                <textarea id="p-nequi" rows="3"></textarea>
            </div>
            <button type="submit" class="btn-submit">Guardar</button>
        </form>
    </div>
</section>
<footer class="footer">
    <p><span class="logo-heavy">HEAVY</span><span class="logo-lux">LUX</span></p>
    <p>© 2026 HeavyLux · Panel Administrativo</p>
</footer>
<script>
    fetch('/api/pago').then(r => r.json()).then(d => {
        document.getElementById('p-transferencia').value = d.transferencia || '';
        document.getElementById('p-nequi').value = d.nequi || '';
    });
    document.getElementById('form-pago').addEventListener('submit', (e) => {
        e.preventDefault();
        fetch('/api/pago', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                transferencia: document.getElementById('p-transferencia').value,
                nequi: document.getElementById('p-nequi').value
            })
        }).then(r => r.json()).then(() => alert('Datos de pago guardados'));
    });
</script>
</body>
</html>
