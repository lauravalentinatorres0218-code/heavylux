<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HeavyLux Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo" style="justify-content:center; margin-bottom:15px;">
                <div class="logo-bars">
                    <div class="logo-bar"></div>
                    <div class="logo-bar"></div>
                </div>
                <div class="logo-text">
                    <span class="logo-heavy">HEAVY</span>
                    <span class="logo-lux">LUX</span>
                </div>
            </div>
            <h2>Iniciar sesión</h2>
            <p class="login-sub">Ingresa tus credenciales para continuar</p>
            <form class="login-form" action="/login" method="POST">
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" name="correo" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <div id="error-login" style="color:#CC0000; font-size:13px; margin-bottom:10px;"></div>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
            <p style="margin-top:20px; font-size:13px; color:#aaaaaa;">¿No tienes cuenta? <a href="/registro" style="color:#CC0000;">Regístrate</a></p>
            <p style="margin-top:20px; font-size:13px;"><a href="/" style="color:#aaaaaa;">← Volver al sitio</a></p>
        </div>
    </div>
    <script>
        if (new URLSearchParams(window.location.search).get('error')) {
            document.getElementById('error-login').textContent = 'Correo o contraseña incorrectos.';
        }
    </script>
</body>
</html>
