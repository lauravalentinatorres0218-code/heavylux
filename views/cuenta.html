<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta - HeavyLux</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="top-bar">
        <p>MI CUENTA · HEAVYLUX</p>
    </div>
    <nav class="navbar">
        <div class="logo">
            <div class="logo-bars">
                <div class="logo-bar"></div>
                <div class="logo-bar"></div>
            </div>
            <div class="logo-text">
                <span class="logo-heavy">HEAVY</span>
                <span class="logo-lux">LUX</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="/">INICIO</a></li>
            <li><a href="/catalogo">CATÁLOGO</a></li>
            <li><a href="/cotizar">COTIZAR</a></li>
            <li><a href="/nosotros">NOSOTROS</a></li>
            <li><a href="/contacto">CONTACTO</a></li>
        </ul>
        <div class="navbar-actions">
            <a href="/admin" class="navbar-icon">PANEL</a>
            <a href="/logout" class="navbar-icon btn-carrito">Cerrar sesión</a>
        </div>
    </nav>
    <section class="cuenta">
        <div class="cuenta-box">
            <h1>Mi cuenta</h1>
            <p class="cuenta-dato"><span>Nombre</span> <strong id="cuenta-nombre">...</strong></p>
            <p class="cuenta-dato"><span>Correo</span> <strong id="cuenta-correo">...</strong></p>
            <p class="cuenta-dato"><span>Rol</span> <strong id="cuenta-rol">...</strong></p>
            <a href="/admin" class="btn-primary">Ir al panel</a>
        </div>
    </section>
    <footer class="footer">
        <p><span class="logo-heavy">HEAVY</span><span class="logo-lux">LUX</span></p>
        <p>© 2026 HeavyLux · Todos los derechos reservados</p>
    </footer>
    <a href="https://wa.me/573137349236?text=Hola%20HeavyLux%2C%20quiero%20informaci%C3%B3n" class="whatsapp-flotante" target="_blank" title="Escríbenos por WhatsApp">
        <svg viewBox="0 0 32 32" width="32" height="32" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.003 3C8.83 3 3 8.83 3 16c0 2.29.6 4.52 1.74 6.49L3 29l6.68-1.72A12.94 12.94 0 0 0 16.003 29C23.17 29 29 23.17 29 16S23.17 3 16.003 3zm0 23.7c-1.95 0-3.86-.53-5.53-1.52l-.4-.24-3.96 1.02 1.06-3.86-.26-.4A10.64 10.64 0 0 1 5.3 16c0-5.9 4.8-10.7 10.7-10.7S26.7 10.1 26.7 16s-4.8 10.7-10.7 10.7z"/>
        </svg>

    <script>
        fetch('/api/cuenta')
            .then(res => res.json())
            .then(u => {
                document.getElementById('cuenta-nombre').textContent = u.nombre;
                document.getElementById('cuenta-correo').textContent = u.correo;
                document.getElementById('cuenta-rol').textContent = u.rol;
            })
            .catch(err => console.error('Error:', err));
    </script>
<a href="https://wa.me/573137349236?text=Hola%20HeavyLux%2C%20quiero%20informaci%C3%B3n" class="whatsapp-flotante" target="_blank" title="Escr%C3%ADbenos por WhatsApp">💬</a>
</html>
