<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizaciones - HeavyLux Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="top-bar"><p>PANEL ADMINISTRATIVO · HEAVYLUX</p></div>
<nav class="navbar">
    <div class="logo">
        <div class="logo-bars"><div class="logo-bar"></div><div class="logo-bar"></div></div>
        <div class="logo-text">
            <span class="logo-heavy">HEAVY</span>
            <span class="logo-lux">LUX</span>
        </div>
    </div>
    <ul class="nav-links">
        <li><a href="/admin">INICIO</a></li>
        <li><a href="/admin/cotizaciones-lista">COTIZACIONES</a></li>
        <li><a href="/admin/pedidos">PEDIDOS</a></li>
        <li><a href="/admin/productos">PRODUCTOS</a></li>
    </ul>
    <div class="navbar-actions">
        <a href="/cuenta" class="navbar-icon btn-carrito">👤 CUENTA</a>
    </div>
</nav>
<section class="admin-dashboard">
    <h1>COTIZACIONES</h1>
    <div class="admin-seccion">
        <table class="admin-tabla">
            <thead>
                <tr>
                    <th>ID</th><th>Nombre</th><th>Teléfono</th><th>Correo</th>
                    <th>Producto</th><th>Estado</th><th>Fecha</th><th>Acción</th>
                </tr>
            </thead>
            <tbody id="cotizaciones-tbody">
                <tr><td colspan="8">Cargando cotizaciones...</td></tr>
            </tbody>
        </table>
    </div>
</section>
<footer class="footer">
    <p><span class="logo-heavy">HEAVY</span><span class="logo-lux">LUX</span></p>
    <p>© 2026 HeavyLux · Panel Administrativo</p>
</footer>
<script>
    function esc(t) {
        return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function cargarCotizaciones() {
        fetch('/admin/cotizaciones')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('cotizaciones-tbody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8">No hay cotizaciones.</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(c => `
                    <tr>
                        <td>${c.id}</td>
                        <td>${esc(c.nombre)}</td>
                        <td>${esc(c.telefono)}</td>
                        <td>${esc(c.correo)}</td>
                        <td>${esc(c.productos_interes || '-')}</td>
                        <td>${esc(c.estado)}</td>
                        <td>${new Date(c.fecha).toLocaleString()}</td>
                        <td>
                            <button onclick="cambiarEstado(${c.id}, '${c.estado === 'pendiente' ? 'atendida' : 'pendiente'}')" style="background:#CC0000; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">
                                ${c.estado === 'pendiente' ? 'Marcar atendida' : 'Reabrir'}
                            </button>
                        </td>
                    </tr>
                `).join('');
            })
            .catch(err => console.error('Error:', err));
    }
    function cambiarEstado(id, estado) {
        fetch('/api/cotizaciones/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ estado })
        }).then(() => cargarCotizaciones());
    }
    cargarCotizaciones();
</script>
<script src="/js/carrito-contador.js"></script>
</body>
</html>
